<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech for Women – Your profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="profile-page">
  <header class="ob-top">
    <div class="inner profile-nav">
      <a class="logo" href="profile.html">Tech for Women</a>
      <nav aria-label="Profile navigation">
        <a href="#profile">Profile</a>
        <a href="#messages">Messages</a>
        <button id="sign-out" type="button">Exit preview</button>
      </nav>
    </div>
  </header>

  <main class="profile-wrap" id="profile">
    <div class="profile-hero">
      <div class="avatar" id="avatar" role="img" aria-label="Your profile photo">👤</div>
      <div class="profile-intro">
        <span class="badge" id="role-badge"></span>
        <h1 id="profile-name"></h1>
        <p id="profile-subtitle"></p>
        <button class="btn btn-ghost" id="edit-profile" type="button">Edit profile</button>
      </div>
    </div>

    <div class="profile-grid">
      <section class="profile-card profile-about" aria-labelledby="about-heading">
        <h2 id="about-heading">About</h2>
        <p id="about-text"></p>
        <div class="profile-topics">
          <h3 id="topics-heading"></h3>
          <div class="topic-tags" id="topic-tags"></div>
        </div>
      </section>

      <section class="profile-card profile-ad" id="ad-card" aria-labelledby="ad-heading">
        <div class="section-kicker">Your teaching ad</div>
        <h2 id="ad-heading"></h2>
        <p id="ad-lessons"></p>
        <div class="profile-meta" id="lesson-formats"></div>
      </section>

      <section class="profile-card profile-messages" id="messages" aria-labelledby="messages-heading">
        <div class="messages-heading">
          <div class="messages-icon" aria-hidden="true">✉</div>
          <div>
            <div class="section-kicker">Your inbox</div>
            <h2 id="messages-heading">Messages</h2>
          </div>
        </div>
        <p class="messaging-status" id="messaging-status" role="status"></p>
        <div id="messaging-app" aria-label="Messaging preview"></div>
      </section>
    </div>
    <p class="preview-note">Local preview only — this is not a real account. Messages stay in this browser and aren't private or synced.</p>
  </main>

  <script src="js/messaging.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
