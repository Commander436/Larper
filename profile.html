<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech for Women – Your profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ob-top"><div class="inner"><a class="logo" href="index.html">tech for women</a></div></div>

  <main class="profile-wrap">
    <h1>You're all set! 🎉</h1>
    <p>Your profile page is coming soon. Here's what you've told us so far:</p>
    <dl class="summary" id="summary"></dl>
    <p style="margin-top:28px"><button class="btn btn-ghost" id="restart" type="button">Edit my answers</button></p>
  </main>

  <script>
    // Placeholder profile page. Replace with the real profile once designed.
    (function () {
      var p = null;
      try {
        if (!localStorage.getItem("tfw_session")) { location.replace("index.html"); return; }
        p = JSON.parse(localStorage.getItem("tfw_profile") || "null");
      } catch (e) {}
      if (!p || !p.complete) { location.replace("onboarding.html"); return; }

      var L = p.location || {};
      var where = [];
      if (L.house) where.push("At my house (" + [L.city, L.zip].filter(Boolean).join(" ") + ")");
      if (L.travel) where.push("Can travel up to " + L.miles + " miles");
      if (L.online) where.push("Online");

      var rows = [
        ["Subjects", (p.topics || []).map(function (t) { return t.split(" › ").pop(); }).join(", ")],
        ["Ad title", p.title],
        ["About my lessons", p.lessons],
        ["About me", p.about],
        ["Lesson location", where.join("\n")]
      ];
      var dl = document.getElementById("summary");
      rows.forEach(function (r) {
        var dt = document.createElement("dt"); dt.textContent = r[0];
        var dd = document.createElement("dd"); dd.textContent = r[1]; // textContent: user input stays inert
        dl.append(dt, dd);
      });

      document.getElementById("restart").addEventListener("click", function () {
        p.complete = false; p.step = 0;
        localStorage.setItem("tfw_profile", JSON.stringify(p));
        location.href = "onboarding.html";
      });
    })();
  </script>
</body>
</html>
